version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: homestock-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homestock}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - homestock_pgdata:/var/lib/postgresql/data

volumes:
  homestock_pgdata:

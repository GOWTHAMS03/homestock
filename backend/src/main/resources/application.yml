spring:
  application:
    name: homestock-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  datasource:
    hikari:
      pool-name: HomeStockHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:25}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      idle-timeout: 300000 # 5 minutes
      max-lifetime: 1200000 # 20 minutes
      connection-timeout: 20000 # 20 seconds
      validation-timeout: 3000 # 3 seconds
      leak-detection-threshold: 30000 # 30 seconds
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 50
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:2000ms}

server:
  port: ${PORT:8080}

app:
  redis:
    enabled: ${REDIS_ENABLED:true}
    cache:
      dashboard-ttl-seconds: ${REDIS_CACHE_DASHBOARD_TTL:300}
      product-ttl-seconds: ${REDIS_CACHE_PRODUCT_TTL:86400}
      deals-ttl-seconds: ${REDIS_CACHE_DEALS_TTL:900}
    lock:
      default-lease-time-seconds: ${REDIS_LOCK_LEASE_SECONDS:10}
      default-wait-time-seconds: ${REDIS_LOCK_WAIT_SECONDS:5}
    rate-limit:
      enabled: ${REDIS_RATE_LIMIT_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:7776000000} # 90 days (maintained until explicit logout)
  storage:
    provider: ${STORAGE_PROVIDER:local} # local or s3
    local:
      upload-dir: ${UPLOAD_DIR:./uploads}
    s3:
      bucket: ${AWS_S3_BUCKET:homestock-media}
      region: ${AWS_REGION:us-east-1}
  smart-shopping:
    enabled: ${SMART_SHOPPING_ENABLED:true}
    cache:
      ttl-minutes: ${PRICE_CACHE_TTL_MINUTES:15}
    matching:
      confidence-threshold: ${MATCH_CONFIDENCE_THRESHOLD:0.75}
    provider-timeout-seconds: ${PROVIDER_TIMEOUT_SECONDS:5}
    providers:
      mock:
        enabled: ${MOCK_PROVIDER_ENABLED:false}
      online:
        enabled: ${ONLINE_PROVIDER_ENABLED:true}
      amazon:
        enabled: ${AMAZON_PROVIDER_ENABLED:true}
        partner-tag: ${AMAZON_PARTNER_TAG:}
        access-key: ${AMAZON_ACCESS_KEY:}
        secret-key: ${AMAZON_SECRET_KEY:}
      flipkart:
        enabled: ${FLIPKART_PROVIDER_ENABLED:true}
        affiliate-id: ${FLIPKART_AFFILIATE_ID:}
        token: ${FLIPKART_AFFILIATE_TOKEN:}
  voice:
    provider: ${VOICE_PROVIDER:whisper} # whisper, mock, local
    whisper:
      api-url: ${WHISPER_API_URL:https://api.openai.com/v1/audio/transcriptions}
      api-key: ${OPENAI_API_KEY:}
      model: ${WHISPER_MODEL:whisper-1}
      temperature: ${WHISPER_TEMPERATURE:0.0}
    limits:
      max-audio-size-mb: ${VOICE_MAX_AUDIO_SIZE_MB:15}
      max-audio-duration-seconds: ${VOICE_MAX_AUDIO_DURATION_SECONDS:60}
    matching:
      confidence-threshold: ${VOICE_CONFIDENCE_THRESHOLD:0.80}
  notifications:
    firebase:
      credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    retention-days: ${NOTIFICATION_RETENTION_DAYS:90}
    cooldown:
      stock-hours: ${NOTIFICATION_STOCK_COOLDOWN_HOURS:24}
      expiry-hours: ${NOTIFICATION_EXPIRY_COOLDOWN_HOURS:24}
      smart-restock-hours: ${NOTIFICATION_RESTOCK_COOLDOWN_HOURS:72}
    quiet-hours:
      default-enabled: ${QUIET_HOURS_ENABLED:false}
      default-start: ${QUIET_HOURS_START:22:00}
      default-end: ${QUIET_HOURS_END:07:00}
    scoring:
      weight-urgency: ${NOTIF_WEIGHT_URGENCY:0.30}
      weight-relevance: ${NOTIF_WEIGHT_RELEVANCE:0.25}
      weight-confidence: ${NOTIF_WEIGHT_CONFIDENCE:0.20}
      weight-action-probability: ${NOTIF_WEIGHT_ACTION_PROB:0.15}
      weight-fatigue: ${NOTIF_WEIGHT_FATIGUE:0.10}
    limits:
      max-push-per-day: ${NOTIF_MAX_PUSH_PER_DAY:5}
      max-notifications-per-hour: ${NOTIF_MAX_NOTIF_PER_HOUR:2}
      consecutive-dismissals-threshold: ${NOTIF_DISMISSAL_THRESHOLD:3}
    grouping:
      min-items-threshold: ${NOTIF_GROUPING_MIN_ITEMS:3}
  scheduler:
    ml-notification:
      enabled: ${ML_NOTIFICATION_SCHEDULER_ENABLED:true}
      cron: ${ML_NOTIFICATION_CRON:0 0 */4 * * *}
  away-summary:
    enabled: ${AWAY_SUMMARY_ENABLED:true}
    min-inactive-days: ${AWAY_MIN_INACTIVE_DAYS:3}
    confidence-threshold: ${AWAY_CONFIDENCE_THRESHOLD:0.40}
    max-summary-items: ${AWAY_MAX_SUMMARY_ITEMS:5}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
      base-path: "/actuator"
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: homestock
    distribution:
      percentiles-histogram:
        http.server.requests: true



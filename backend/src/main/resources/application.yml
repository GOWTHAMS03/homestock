spring:
  application:
    name: homestock-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:7776000000} # 90 days (maintained until explicit logout)
  storage:
    provider: ${STORAGE_PROVIDER:local} # local or s3
    local:
      upload-dir: ${UPLOAD_DIR:./uploads}
    s3:
      bucket: ${AWS_S3_BUCKET:homestock-media}
      region: ${AWS_REGION:us-east-1}
  smart-shopping:
    enabled: ${SMART_SHOPPING_ENABLED:true}
    cache:
      ttl-minutes: ${PRICE_CACHE_TTL_MINUTES:15}
    matching:
      confidence-threshold: ${MATCH_CONFIDENCE_THRESHOLD:0.75}
    provider-timeout-seconds: ${PROVIDER_TIMEOUT_SECONDS:5}
    providers:
      mock:
        enabled: ${MOCK_PROVIDER_ENABLED:true}
      amazon:
        enabled: ${AMAZON_PROVIDER_ENABLED:false}
        partner-tag: ${AMAZON_PARTNER_TAG:}
        access-key: ${AMAZON_ACCESS_KEY:}
        secret-key: ${AMAZON_SECRET_KEY:}
      flipkart:
        enabled: ${FLIPKART_PROVIDER_ENABLED:false}
        affiliate-id: ${FLIPKART_AFFILIATE_ID:}
        token: ${FLIPKART_AFFILIATE_TOKEN:}
  voice:
    provider: ${VOICE_PROVIDER:whisper} # whisper, mock, local
    whisper:
      api-url: ${WHISPER_API_URL:https://api.openai.com/v1/audio/transcriptions}
      api-key: ${OPENAI_API_KEY:}
      model: ${WHISPER_MODEL:whisper-1}
      temperature: ${WHISPER_TEMPERATURE:0.0}
    limits:
      max-audio-size-mb: ${VOICE_MAX_AUDIO_SIZE_MB:15}
      max-audio-duration-seconds: ${VOICE_MAX_AUDIO_DURATION_SECONDS:60}
    matching:
      confidence-threshold: ${VOICE_CONFIDENCE_THRESHOLD:0.80}
  notifications:
    firebase:
      credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    retention-days: ${NOTIFICATION_RETENTION_DAYS:90}
    cooldown:
      stock-hours: ${NOTIFICATION_STOCK_COOLDOWN_HOURS:24}
      expiry-hours: ${NOTIFICATION_EXPIRY_COOLDOWN_HOURS:24}
      smart-restock-hours: ${NOTIFICATION_RESTOCK_COOLDOWN_HOURS:72}
    quiet-hours:
      default-enabled: ${QUIET_HOURS_ENABLED:false}
      default-start: ${QUIET_HOURS_START:22:00}
      default-end: ${QUIET_HOURS_END:07:00}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

